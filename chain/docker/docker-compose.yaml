# Docker Compose for ZK Credit Scoring Consortium
# T31a: 3 endorsers + 1 read-only regulatory observer + Raft orderer

version: '3.7'

volumes:
  orderer.orderer.credit.ng:
  peer0.commercialbanka.credit.ng:
  peer0.microfinanceb.credit.ng:
  peer0.fintechc.credit.ng:
  peer0.regulator.credit.ng:

networks:
  credit_network:
    name: credit_network

services:
  # Orderer Node (Raft single-node for development)
  orderer.orderer.credit.ng:
    container_name: orderer.orderer.credit.ng
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ../config/crypto-config/ordererOrganizations/orderer.credit.ng/orderers/orderer.orderer.credit.ng/msp:/var/hyperledger/orderer/msp
      - ../config/crypto-config/ordererOrganizations/orderer.credit.ng/orderers/orderer.orderer.credit.ng/tls:/var/hyperledger/orderer/tls
      - orderer.orderer.credit.ng:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
    networks:
      - credit_network

  # Commercial Bank A - Primary Endorser
  peer0.commercialbanka.credit.ng:
    container_name: peer0.commercialbanka.credit.ng
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=credit_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.commercialbanka.credit.ng
      - CORE_PEER_ADDRESS=peer0.commercialbanka.credit.ng:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.commercialbanka.credit.ng:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.commercialbanka.credit.ng:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.commercialbanka.credit.ng:7051
      - CORE_PEER_LOCALMSPID=CommercialBankAMSP
      - CORE_OPERATIONS_LISTENADDRESS=peer0.commercialbanka.credit.ng:9444
      - CORE_METRICS_PROVIDER=prometheus
    volumes:
      - //var/run/docker.sock:/host/var/run/docker.sock
      - ../config/crypto-config/peerOrganizations/commercialbanka.credit.ng/peers/peer0.commercialbanka.credit.ng/msp:/etc/hyperledger/fabric/msp
      - ../config/crypto-config/peerOrganizations/commercialbanka.credit.ng/peers/peer0.commercialbanka.credit.ng/tls:/etc/hyperledger/fabric/tls
      - peer0.commercialbanka.credit.ng:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
      - 9444:9444
    networks:
      - credit_network

  # Microfinance B - Endorser
  peer0.microfinanceb.credit.ng:
    container_name: peer0.microfinanceb.credit.ng
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=credit_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.microfinanceb.credit.ng
      - CORE_PEER_ADDRESS=peer0.microfinanceb.credit.ng:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.microfinanceb.credit.ng:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.microfinanceb.credit.ng:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.microfinanceb.credit.ng:8051
      - CORE_PEER_LOCALMSPID=MicrofinanceBMSP
      - CORE_OPERATIONS_LISTENADDRESS=peer0.microfinanceb.credit.ng:9445
      - CORE_METRICS_PROVIDER=prometheus
    volumes:
      - //var/run/docker.sock:/host/var/run/docker.sock
      - ../config/crypto-config/peerOrganizations/microfinanceb.credit.ng/peers/peer0.microfinanceb.credit.ng/msp:/etc/hyperledger/fabric/msp
      - ../config/crypto-config/peerOrganizations/microfinanceb.credit.ng/peers/peer0.microfinanceb.credit.ng/tls:/etc/hyperledger/fabric/tls
      - peer0.microfinanceb.credit.ng:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 8051:8051
      - 9445:9445
    networks:
      - credit_network

  # Fintech C - Endorser
  peer0.fintechc.credit.ng:
    container_name: peer0.fintechc.credit.ng
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=credit_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.fintechc.credit.ng
      - CORE_PEER_ADDRESS=peer0.fintechc.credit.ng:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.fintechc.credit.ng:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.fintechc.credit.ng:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.fintechc.credit.ng:9051
      - CORE_PEER_LOCALMSPID=FintechCMSP
      - CORE_OPERATIONS_LISTENADDRESS=peer0.fintechc.credit.ng:9446
      - CORE_METRICS_PROVIDER=prometheus
    volumes:
      - //var/run/docker.sock:/host/var/run/docker.sock
      - ../config/crypto-config/peerOrganizations/fintechc.credit.ng/peers/peer0.fintechc.credit.ng/msp:/etc/hyperledger/fabric/msp
      - ../config/crypto-config/peerOrganizations/fintechc.credit.ng/peers/peer0.fintechc.credit.ng/tls:/etc/hyperledger/fabric/tls
      - peer0.fintechc.credit.ng:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 9051:9051
      - 9446:9446
    networks:
      - credit_network

  # Regulatory Observer - READ-ONLY (embedded supervision per Auer 2022)
  # This peer can query but CANNOT endorse transactions
  peer0.regulator.credit.ng:
    container_name: peer0.regulator.credit.ng
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=credit_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.regulator.credit.ng
      - CORE_PEER_ADDRESS=peer0.regulator.credit.ng:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regulator.credit.ng:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regulator.credit.ng:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regulator.credit.ng:10051
      - CORE_PEER_LOCALMSPID=RegulatoryObserverMSP
      - CORE_OPERATIONS_LISTENADDRESS=peer0.regulator.credit.ng:9447
      - CORE_METRICS_PROVIDER=prometheus
    volumes:
      - //var/run/docker.sock:/host/var/run/docker.sock
      - ../config/crypto-config/peerOrganizations/regulator.credit.ng/peers/peer0.regulator.credit.ng/msp:/etc/hyperledger/fabric/msp
      - ../config/crypto-config/peerOrganizations/regulator.credit.ng/peers/peer0.regulator.credit.ng/tls:/etc/hyperledger/fabric/tls
      - peer0.regulator.credit.ng:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 10051:10051
      - 9447:9447
    networks:
      - credit_network

  # CLI container for administrative tasks
  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.commercialbanka.credit.ng:7051
      - CORE_PEER_LOCALMSPID=CommercialBankAMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/commercialbanka.credit.ng/peers/peer0.commercialbanka.credit.ng/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/commercialbanka.credit.ng/peers/peer0.commercialbanka.credit.ng/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/commercialbanka.credit.ng/peers/peer0.commercialbanka.credit.ng/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/commercialbanka.credit.ng/users/Admin@commercialbanka.credit.ng/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - //var/run/docker.sock:/host/var/run/docker.sock
      - ../chaincode:/opt/gopath/src/github.com/hyperledger/fabric-samples/chaincode
      - ../config/crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ../scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
    depends_on:
      - orderer.orderer.credit.ng
      - peer0.commercialbanka.credit.ng
      - peer0.microfinanceb.credit.ng
      - peer0.fintechc.credit.ng
      - peer0.regulator.credit.ng
    networks:
      - credit_network
